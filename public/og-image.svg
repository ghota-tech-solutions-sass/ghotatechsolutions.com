<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020617;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="200" fill="rgba(59,130,246,0.1)" />
  <circle cx="1100" cy="530" r="250" fill="rgba(99,102,241,0.1)" />

  <!-- Logo/Title -->
  <text x="600" y="280" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="url(#textGrad)" text-anchor="middle">Ghota Tech Solutions</text>

  <!-- Tagline -->
  <text x="600" y="360" font-family="Arial, sans-serif" font-size="32" fill="#94a3b8" text-anchor="middle">Votre partenaire DevOps expert</text>

  <!-- Keywords -->
  <text x="600" y="450" font-family="Arial, sans-serif" font-size="24" fill="#64748b" text-anchor="middle">GCP • Kubernetes • CI/CD • Terraform • Docker</text>

  <!-- Bottom accent line -->
  <rect x="400" y="520" width="400" height="4" rx="2" fill="url(#textGrad)"/>
</svg>
